pre-commit:
  parallel: true
  commands:
    backend-format:
      glob: "backend/**/*.go"
      run: gofmt -w {staged_files} && git add {staged_files}

    backend-lint:
      glob: "backend/**/*.go"
      run: task lint

    backend-test:
      glob: "backend/**/*.go"
      run: task test

    ios-format-check:
      glob: "ios/**/*.swift"
      run: task ios:format-check

    ios-lint:
      glob: "ios/**/*.swift"
      run: task ios:lint
