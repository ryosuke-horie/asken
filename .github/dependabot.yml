version: 2
updates:
  # Go modules (backend)
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      testing:
        patterns:
          - "github.com/stretchr/testify"
      security:
        patterns:
          - "github.com/golang-jwt/*"
          - "golang.org/x/crypto"

  # Swift (iOS)
  - package-ecosystem: "swift"
    directory: "/ios"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      testing:
        patterns:
          - "swift-snapshot-testing"
          - "swift-custom-dump"
          - "xctest-dynamic-overlay"
      swift-ecosystem:
        patterns:
          - "swift-syntax"

  # Docker (backend)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
