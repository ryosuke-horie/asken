# =============================================================================
# Cloud Run Deploy Workflow
# =============================================================================
# mainブランチへのpush時にバックエンドをCloud Runにデプロイ

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    # 手動デプロイ用（GitHub Actions UIから実行可能）

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 変更検出
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'

  # ---------------------------------------------------------------------------
  # ビルド＆デプロイ
  # ---------------------------------------------------------------------------
  deploy:
    needs: changes
    # workflow_dispatch（手動実行）の場合は常にデプロイ、pushの場合は変更検出結果に従う
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
      CLOUD_RUN_SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT_EMAIL: ${{ vars.DEPLOY_SERVICE_ACCOUNT_EMAIL }}

    steps:
      - name: Validate required variables
        run: |
          missing_vars=()
          [ -z "$GCP_REGION" ] && missing_vars+=("GCP_REGION")
          [ -z "$ARTIFACT_REGISTRY_URL" ] && missing_vars+=("ARTIFACT_REGISTRY_URL")
          [ -z "$CLOUD_RUN_SERVICE_NAME" ] && missing_vars+=("CLOUD_RUN_SERVICE_NAME")
          [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] && missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          [ -z "$DEPLOY_SERVICE_ACCOUNT_EMAIL" ] && missing_vars+=("DEPLOY_SERVICE_ACCOUNT_EMAIL")

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required variables: ${missing_vars[*]}"
            echo "### Configuration Error" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing variables: ${missing_vars[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required variables are set"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Google Cloud CLI
        id: gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        id: docker-config
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set image tag
        id: image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_TAG="${ARTIFACT_REGISTRY_URL}/backend:${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build Docker image
        id: build
        working-directory: backend
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "${IMAGE_TAG}" \
            -t "${ARTIFACT_REGISTRY_URL}/backend:latest" \
            .

      - name: Push Docker image
        id: push
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "${IMAGE_TAG}"
          docker push "${ARTIFACT_REGISTRY_URL}/backend:latest"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE_NAME}" \
            --image "${IMAGE_TAG}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --quiet

      - name: Show deployment URL
        if: success()
        run: |
          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')
          echo "Deployed to: ${URL}"
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          GCLOUD_OUTCOME: ${{ steps.gcloud.outcome }}
          DOCKER_CONFIG_OUTCOME: ${{ steps.docker-config.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "### Deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Failed step:**" >> "$GITHUB_STEP_SUMMARY"
          [ "$AUTH_OUTCOME" = "failure" ] && echo "- Google Cloud Authentication" >> "$GITHUB_STEP_SUMMARY"
          [ "$GCLOUD_OUTCOME" = "failure" ] && echo "- Setup Google Cloud CLI" >> "$GITHUB_STEP_SUMMARY"
          [ "$DOCKER_CONFIG_OUTCOME" = "failure" ] && echo "- Configure Docker" >> "$GITHUB_STEP_SUMMARY"
          [ "$BUILD_OUTCOME" = "failure" ] && echo "- Docker Build" >> "$GITHUB_STEP_SUMMARY"
          [ "$PUSH_OUTCOME" = "failure" ] && echo "- Docker Push" >> "$GITHUB_STEP_SUMMARY"
          [ "$DEPLOY_OUTCOME" = "failure" ] && echo "- Cloud Run Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${IMAGE_TAG:-'(not set)'}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Service:** ${CLOUD_RUN_SERVICE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Region:** ${GCP_REGION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the workflow logs for details." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # E2E テスト
  # ---------------------------------------------------------------------------
  e2e-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT_EMAIL: ${{ vars.DEPLOY_SERVICE_ACCOUNT_EMAIL }}
      # ランタイムSA: E2EテストのFirebase CustomToken署名でServiceAccountIDとして使用
      SERVICE_ACCOUNT_EMAIL: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

    steps:
      - name: Validate required variables
        env:
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
        run: |
          missing_vars=()
          [ -z "$GCP_REGION" ] && missing_vars+=("GCP_REGION")
          [ -z "$CLOUD_RUN_SERVICE_NAME" ] && missing_vars+=("CLOUD_RUN_SERVICE_NAME")
          [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] && missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          [ -z "$DEPLOY_SERVICE_ACCOUNT_EMAIL" ] && missing_vars+=("DEPLOY_SERVICE_ACCOUNT_EMAIL")
          [ -z "$SERVICE_ACCOUNT_EMAIL" ] && missing_vars+=("SERVICE_ACCOUNT_EMAIL")
          [ -z "$E2E_FIREBASE_API_KEY" ] && missing_vars+=("E2E_FIREBASE_API_KEY")

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required variables: ${missing_vars[*]}"
            echo "### E2E Configuration Error" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing variables: ${missing_vars[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required variables are set"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      # WIF認証はデプロイSAで行う（ランタイムSAのsignBlob呼び出し権限を持つ）
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Get Cloud Run URL
        id: get-url
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')
          if [ -z "$URL" ]; then
            echo "::error::Failed to get Cloud Run URL for ${CLOUD_RUN_SERVICE_NAME}"
            exit 1
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: ${URL}"

      - name: Run E2E tests
        env:
          E2E_BASE_URL: ${{ steps.get-url.outputs.url }}
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
          E2E_TEST_UID: "e2e-test-user"
        working-directory: backend
        run: |
          echo "Running E2E tests against ${E2E_BASE_URL}"
          go test -v -tags=e2e ./e2e/... 2>&1 | tee e2e-results.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          exit $TEST_EXIT_CODE

      - name: Report E2E results
        if: always()
        working-directory: backend
        run: |
          echo "### E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f e2e-results.txt ]; then
            # テスト結果のサマリを抽出
            if grep -q "PASS" e2e-results.txt; then
              PASSED=$(grep -c "^--- PASS" e2e-results.txt || echo "0")
              echo "Passed: ${PASSED} tests" >> "$GITHUB_STEP_SUMMARY"
            fi
            if grep -q "FAIL" e2e-results.txt; then
              FAILED=$(grep -c "^--- FAIL" e2e-results.txt || echo "0")
              echo "Failed: ${FAILED} tests" >> "$GITHUB_STEP_SUMMARY"
            fi
            if grep -q "SKIP" e2e-results.txt; then
              SKIPPED=$(grep -c "^--- SKIP" e2e-results.txt || echo "0")
              echo "Skipped: ${SKIPPED} tests" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No test results found" >> "$GITHUB_STEP_SUMMARY"
          fi
