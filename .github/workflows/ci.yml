name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.39.2
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: task frontend:install

      - name: Lint
        run: task frontend:lint

      - name: Check unused code
        run: task frontend:knip

      - name: Check unused dependencies
        run: task frontend:depcheck

      - name: Run tests
        run: task frontend:test

      - name: Build
        run: task frontend:build

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install Go tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.39.2
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Lint
        run: task lint

      - name: Run tests
        run: task test
