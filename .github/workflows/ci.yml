name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'Taskfile.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'
              - 'Taskfile.yml'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install Go tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.39.2
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Lint
        run: task lint

      - name: Run tests
        run: task test

  ios-lint:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          SWIFTLINT_VERSION=0.57.0
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux.zip" -o swiftlint.zip
          unzip -q swiftlint.zip -d swiftlint
          sudo mv swiftlint/swiftlint /usr/local/bin/
          rm -rf swiftlint swiftlint.zip

      - name: Install SwiftFormat
        run: |
          SWIFTFORMAT_VERSION=0.54.6
          curl -sL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip" -o swiftformat.zip
          unzip -q swiftformat.zip
          sudo mv swiftformat /usr/local/bin/
          rm swiftformat.zip

      - name: SwiftLint
        working-directory: ios
        run: swiftlint lint --strict

      - name: SwiftFormat Check
        working-directory: ios
        run: swiftformat . --lint
