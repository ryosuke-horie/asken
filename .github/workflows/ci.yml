name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'Taskfile.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'
              - 'Taskfile.yml'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install Go tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.39.2
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Lint
        run: task lint

      - name: Run tests
        run: task test

  ios-lint:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install SwiftLint
        run: |
          SWIFTLINT_VERSION=0.63.2
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o swiftlint.zip
          unzip -q swiftlint.zip
          sudo mv swiftlint /usr/local/bin/
          rm swiftlint.zip

      - name: Install SwiftFormat
        run: |
          SWIFTFORMAT_VERSION=0.59.1
          curl -sL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip" -o swiftformat.zip
          unzip -q swiftformat.zip
          sudo mv swiftformat_linux /usr/local/bin/swiftformat
          rm swiftformat.zip

      - name: SwiftLint
        working-directory: ios
        run: swiftlint lint --strict

      - name: SwiftFormat Check
        working-directory: ios
        run: swiftformat . --lint
