run:
  timeout: 5m
  go: '1.23'

linters:
  disable-all: true
  enable:
    # デフォルト推奨
    - errcheck      # エラーチェック漏れ
    - gosimple      # コードの簡素化提案
    - govet         # go vet互換チェック
    - ineffassign   # 無効な代入検出
    - staticcheck   # 静的解析
    - unused        # 未使用コード検出
    # 追加（厳格設定）
    - revive        # 包括的なコードスタイルチェック
    - gocyclo       # 循環複雑度チェック
    - misspell      # スペルミス検出
    - prealloc      # スライス事前確保の提案
    - gocritic      # コードパターンの改善提案
    - gofmt         # フォーマットチェック
    - goimports     # インポート順序チェック
    - unconvert     # 不要な型変換検出

linters-settings:
  gocyclo:
    min-complexity: 15

  revive:
    rules:
      - name: exported
        disabled: true  # エクスポート関数のコメント強制を無効化

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam  # 大きな構造体の値渡し警告を無効化

  misspell:
    locale: US
    ignore-words:
      - analyses  # analysisの複数形（正しい英語）

issues:
  exclude-rules:
    # テストファイルでは一部ルールを緩和
    - path: _test\.go
      linters:
        - errcheck    # テストでのエラーチェック省略を許容
        - gocritic    # テストコードのスタイルを緩和

  max-issues-per-linter: 0
  max-same-issues: 0
