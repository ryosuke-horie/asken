version: "2"

run:
  timeout: 5m
  go: '1.25'  # CIと統一（.github/workflows/ci.yml）

linters:
  disable-all: true
  enable:
    # デフォルト推奨
    - errcheck      # エラーチェック漏れ
    - govet         # go vet互換チェック
    - ineffassign   # 無効な代入検出
    - staticcheck   # 静的解析（gosimple含む）
    - unused        # デッドコード検出（未使用の関数・変数・定数・型を検出）
    # 追加
    - gocyclo       # 循環複雑度チェック
    - misspell      # スペルミス検出
    - unconvert     # 不要な型変換検出

  settings:
    gocyclo:
      min-complexity: 25  # 既存関数の複雑度対応のため一時的に緩和（UTK-19で15に戻す）

    errcheck:
      exclude-functions:
        # deferでのClose/Remove等は除外（一般的なパターン）
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - os.Remove
      check-blank: false

    misspell:
      locale: US
      ignore-words:
        - analyses

    staticcheck:
      checks:
        - "all"
        - "-ST1000"  # パッケージコメントを必須としない
        - "-ST1005"  # エラー文字列の大文字化を許容（日本語対応）
        - "-ST1020"  # メソッドコメント形式を強制しない
        - "-ST1021"  # 型コメント形式を強制しない
        - "-QF1003"  # tagged switchの提案を無効化

  exclusions:
    rules:
      # テストファイルではerrcheckを緩和
      - path: "_test\\.go"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
