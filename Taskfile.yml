version: "3"

silent: true

vars:
  BACKEND_DIR: backend
  DOCKER_COMPOSE: docker-compose

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list

  help:
    desc: タスク一覧を表示
    cmds:
      - task --list

  setup:
    desc: 初期セットアップ（依存関係のダウンロード）
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Backend依存関係をダウンロード ==="
      - go mod download
      - echo "セットアップ完了"

  clean:
    desc: ビルド成果物を削除
    cmds:
      - echo "=== クリーンアップ ==="
      - rm -f "{{.BACKEND_DIR}}/bin/"*
      - echo "クリーンアップ完了"

  test:
    desc: Goテストを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goテスト実行 ==="
      - go test ./...

  lint:
    desc: Goリント（golangci-lint）を実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goリント実行 ==="
      - golangci-lint run ./...

  build:
    desc: Goバイナリをビルド
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goビルド ==="
      - mkdir -p bin
      - go build -o bin/server ./cmd/server

  run:
    desc: バックエンドサーバーを起動
    dir: "{{.BACKEND_DIR}}"
    dotenv: [".env"]
    cmds:
      - echo "=== サーバー起動 ==="
      - go run ./cmd/server

  db-up:
    desc: PostgreSQLを起動
    cmds:
      - echo "=== PostgreSQL起動 ==="
      - "{{.DOCKER_COMPOSE}} up -d"

  db-down:
    desc: PostgreSQLを停止
    cmds:
      - echo "=== PostgreSQL停止 ==="
      - "{{.DOCKER_COMPOSE}} down"

  db-seed:
    desc: テストデータを投入
    cmds:
      - echo "=== シードデータ投入 ==="
      - |
          if [ -f "{{.BACKEND_DIR}}/.env" ]; then
            export $(cat "{{.BACKEND_DIR}}/.env" | grep -v '^#' | xargs)
            (cd "{{.BACKEND_DIR}}" && go run ./cmd/seed -verbose)
          else
            (cd "{{.BACKEND_DIR}}" && go run ./cmd/seed -verbose)
          fi

  db-clean:
    desc: DBをリセット（ボリューム削除+再起動）
    cmds:
      - echo "=== DBリセット ==="
      - "{{.DOCKER_COMPOSE}} down -v"
      - "{{.DOCKER_COMPOSE}} up -d"
      - echo "DBの起動を待機中..."
      - sleep 3
      - echo "DBリセット完了"

  ios:generate-mocks:
    desc: Mockoloでモックを生成
    dir: ios
    cmds:
      - echo "=== Mockを生成 ==="
      - mkdir -p UchikomiTests/Generated
      - mockolo -s Uchikomi -d UchikomiTests/Generated/MockGenerated.swift --testable-imports Uchikomi

  ios:test:
    desc: iOSのテストを実行
    dir: ios
    cmds:
      - echo "=== iOSテスト実行 ==="
      - xcodebuild test -project Uchikomi.xcodeproj -scheme Uchikomi -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -quiet

  ios:lint:
    desc: SwiftLintを実行
    dir: ios
    cmds:
      - echo "=== SwiftLint実行 ==="
      - swiftlint lint --strict

  ios:format:
    desc: SwiftFormatを実行（コードを整形）
    dir: ios
    cmds:
      - echo "=== SwiftFormat実行 ==="
      - swiftformat .

  ios:format-check:
    desc: SwiftFormatのチェック（変更なし、CI用）
    dir: ios
    cmds:
      - echo "=== SwiftFormatチェック ==="
      - swiftformat . --lint
