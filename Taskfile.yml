version: "3"

silent: true

vars:
  BACKEND_DIR: backend
  DOCKER_COMPOSE: docker-compose

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list

  help:
    desc: タスク一覧を表示
    cmds:
      - task --list

  setup:
    desc: 初期セットアップ（依存関係のダウンロード）
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Backend依存関係をダウンロード ==="
      - go mod download
      - echo "セットアップ完了"

  clean:
    desc: ビルド成果物を削除
    cmds:
      - echo "=== クリーンアップ ==="
      - rm -f "{{.BACKEND_DIR}}/bin/"*
      - echo "クリーンアップ完了"

  test:
    desc: Goテストを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goテスト実行 ==="
      - go test ./...

  test:coverage:
    desc: Goテストをカバレッジ計測付きで実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goカバレッジ計測 ==="
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - echo ""
      - 'echo "HTMLレポートを生成: coverage.html"'
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Goリント（golangci-lint）を実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goリント実行 ==="
      - golangci-lint run ./...

  build:
    desc: Goバイナリをビルド
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goビルド ==="
      - mkdir -p bin
      - go build -o bin/server ./cmd/server

  run:
    desc: バックエンドサーバーを起動
    dir: "{{.BACKEND_DIR}}"
    dotenv: [".env"]
    cmds:
      - echo "=== サーバー起動 ==="
      - go run ./cmd/server

  db-up:
    desc: PostgreSQLを起動
    cmds:
      - echo "=== PostgreSQL起動 ==="
      - "{{.DOCKER_COMPOSE}} up -d"

  db-down:
    desc: PostgreSQLを停止
    cmds:
      - echo "=== PostgreSQL停止 ==="
      - "{{.DOCKER_COMPOSE}} down"

  db-seed:
    desc: テストデータを投入
    cmds:
      - echo "=== シードデータ投入 ==="
      - |
          if [ -f "{{.BACKEND_DIR}}/.env" ]; then
            export $(cat "{{.BACKEND_DIR}}/.env" | grep -v '^#' | xargs)
            (cd "{{.BACKEND_DIR}}" && go run ./cmd/seed -verbose)
          else
            (cd "{{.BACKEND_DIR}}" && go run ./cmd/seed -verbose)
          fi

  db-clean:
    desc: DBをリセット（ボリューム削除+再起動）
    cmds:
      - echo "=== DBリセット ==="
      - "{{.DOCKER_COMPOSE}} down -v"
      - "{{.DOCKER_COMPOSE}} up -d"
      - echo "DBの起動を待機中..."
      - sleep 3
      - echo "DBリセット完了"

  ios:generate-mocks:
    desc: Mockoloでモックを生成
    dir: ios
    cmds:
      - echo "=== Mockを生成 ==="
      - mkdir -p UchikomiTests/Generated
      - mockolo -s Uchikomi -d UchikomiTests/Generated/MockGenerated.swift --testable-imports Uchikomi

  ios:test:
    desc: iOSのテストを実行
    dir: ios
    cmds:
      - echo "=== iOSテスト実行 ==="
      - xcodebuild test -project Uchikomi.xcodeproj -scheme Uchikomi -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -quiet

  ios:test:coverage:
    desc: iOSテストをカバレッジ計測付きで実行
    dir: ios
    cmds:
      - echo "=== iOSカバレッジ計測 ==="
      - xcodebuild test -project Uchikomi.xcodeproj -scheme Uchikomi -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -enableCodeCoverage YES -resultBundlePath TestResults.xcresult
      - echo ""
      - echo "=== カバレッジレポート ==="
      - xcrun xccov view --report TestResults.xcresult

  ios:lint:
    desc: SwiftLintを実行
    dir: ios
    cmds:
      - echo "=== SwiftLint実行 ==="
      - swiftlint lint --strict

  ios:format:
    desc: SwiftFormatを実行（コードを整形）
    dir: ios
    cmds:
      - echo "=== SwiftFormat実行 ==="
      - swiftformat .

  ios:format-check:
    desc: SwiftFormatのチェック（変更なし、CI用）
    dir: ios
    cmds:
      - echo "=== SwiftFormatチェック ==="
      - swiftformat . --lint

  ios:clean:
    desc: iOSビルドキャッシュを削除（DerivedData）
    cmds:
      - echo "=== iOS DerivedData削除 ==="
      - rm -rf ~/Library/Developer/Xcode/DerivedData
      - echo "DerivedData削除完了"

  ios:clean-all:
    desc: iOSビルドキャッシュを完全削除（SPMキャッシュ含む）
    cmds:
      - echo "=== iOS完全クリーンアップ ==="
      - echo "Xcodeを終了..."
      - killall Xcode 2>/dev/null || true
      - echo "DerivedData削除..."
      - rm -rf ~/Library/Developer/Xcode/DerivedData
      - echo "SPMキャッシュ削除..."
      - rm -rf ~/Library/Caches/org.swift.swiftpm
      - echo "プロジェクトローカルキャッシュ削除..."
      - rm -rf ios/.swiftpm
      - rm -rf ios/.build
      - echo "Package.resolved削除（再解決を強制）..."
      - rm -f ios/Uchikomi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - echo ""
      - echo "完全クリーンアップ完了"
      - echo "次のステップ:"
      - echo "  1. open ios/Uchikomi.xcodeproj"
      - echo "  2. File > Packages > Resolve Package Versions"
      - echo "  3. Product > Clean Build Folder (Shift+Cmd+K)"

  ios:reset-packages:
    desc: Package.resolvedを削除してSPM依存関係を再解決
    cmds:
      - echo "=== Package.resolved削除 ==="
      - rm -f ios/Uchikomi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - echo "Package.resolved削除完了"
      - echo "Xcodeで File > Packages > Resolve Package Versions を実行してください"
