version: "3"

silent: true

vars:
  BACKEND_DIR: backend

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list

  help:
    desc: タスク一覧を表示
    cmds:
      - task --list

  setup:
    desc: 初期セットアップ（依存関係のダウンロード）
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Backend依存関係をダウンロード ==="
      - go mod download
      - echo "セットアップ完了"

  clean:
    desc: ビルド成果物を削除
    cmds:
      - echo "=== クリーンアップ ==="
      - rm -f "{{.BACKEND_DIR}}/bin/"*
      - echo "クリーンアップ完了"

  test:
    desc: Goテストを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goテスト実行 ==="
      - go test ./...

  test:coverage:
    desc: Goテストをカバレッジ計測付きで実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goカバレッジ計測 ==="
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - echo ""
      - 'echo "HTMLレポートを生成: coverage.html"'
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Goリント（golangci-lint）を実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goリント実行 ==="
      - golangci-lint run ./...

  build:
    desc: Goバイナリをビルド
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Goビルド ==="
      - mkdir -p bin
      - go build -o bin/server ./cmd/server

  run:
    desc: バックエンドサーバーを起動
    dir: "{{.BACKEND_DIR}}"
    dotenv: [".env"]
    cmds:
      - echo "=== サーバー起動 ==="
      - go run ./cmd/server

  ios:generate-mocks:
    desc: Mockoloでモックを生成
    dir: ios
    cmds:
      - echo "=== Mockを生成 ==="
      - mkdir -p UchikomiTests/Generated
      - mockolo -s Uchikomi -d UchikomiTests/Generated/MockGenerated.swift --testable-imports Uchikomi

  ios:test:
    desc: iOSのテストを実行
    dir: ios
    cmds:
      - echo "=== iOSテスト実行 ==="
      - xcodebuild test -project Uchikomi.xcodeproj -scheme Uchikomi -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -quiet

  ios:test:coverage:
    desc: iOSテストをカバレッジ計測付きで実行
    dir: ios
    cmds:
      - echo "=== iOSカバレッジ計測 ==="
      - xcodebuild test -project Uchikomi.xcodeproj -scheme Uchikomi -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -enableCodeCoverage YES -resultBundlePath TestResults.xcresult
      - echo ""
      - echo "=== カバレッジレポート ==="
      - xcrun xccov view --report TestResults.xcresult

  ios:lint:
    desc: SwiftLintを実行
    dir: ios
    cmds:
      - echo "=== SwiftLint実行 ==="
      - swiftlint lint --strict

  ios:deadcode:
    desc: Swiftデッドコード検知（Periphery）を実行
    dir: ios
    preconditions:
      - sh: command -v periphery
        msg: "Periphery がインストールされていません。`brew install peripheryapp/periphery/periphery` を実行してください。"
    vars:
      PLIST_PATH: Uchikomi/Resources/GoogleService-Info.plist
    cmds:
      - echo "=== Periphery デッドコード検知 ==="
      - |
        CREATED_DUMMY=false
        cleanup() {
          if [ "$CREATED_DUMMY" = true ]; then
            rm -f "{{.PLIST_PATH}}"
            echo "ダミー GoogleService-Info.plist を削除しました"
          fi
        }
        trap cleanup EXIT
        if [ ! -f "{{.PLIST_PATH}}" ]; then
          echo "GoogleService-Info.plist が見つかりません。ダミーを生成します..."
          cat > "{{.PLIST_PATH}}" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>API_KEY</key><string>dummy</string>
  <key>GCM_SENDER_ID</key><string>000000000000</string>
  <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
  <key>PROJECT_ID</key><string>dummy-project</string>
  <key>BUNDLE_ID</key><string>dev.exe.uchikomi</string>
</dict>
</plist>
PLIST
          if [ ! -f "{{.PLIST_PATH}}" ]; then
            echo "ERROR: ダミー GoogleService-Info.plist の生成に失敗しました" >&2
            exit 1
          fi
          CREATED_DUMMY=true
        fi
        periphery scan

  ios:format:
    desc: SwiftFormatを実行（コードを整形）
    dir: ios
    cmds:
      - echo "=== SwiftFormat実行 ==="
      - swiftformat .

  ios:format-check:
    desc: SwiftFormatのチェック（変更なし、CI用）
    dir: ios
    cmds:
      - echo "=== SwiftFormatチェック ==="
      - swiftformat . --lint

  ios:clean:
    desc: iOSビルドキャッシュを削除（DerivedData）
    cmds:
      - echo "=== iOS DerivedData削除 ==="
      - rm -rf ~/Library/Developer/Xcode/DerivedData
      - echo "DerivedData削除完了"

  ios:clean-all:
    desc: iOSビルドキャッシュを完全削除（SPMキャッシュ含む）
    cmds:
      - echo "=== iOS完全クリーンアップ ==="
      - echo "Xcodeを終了..."
      - killall Xcode 2>/dev/null || true
      - echo "DerivedData削除..."
      - rm -rf ~/Library/Developer/Xcode/DerivedData
      - echo "SPMキャッシュ削除..."
      - rm -rf ~/Library/Caches/org.swift.swiftpm
      - echo "プロジェクトローカルキャッシュ削除..."
      - rm -rf ios/.swiftpm
      - rm -rf ios/.build
      - echo "Package.resolved削除（再解決を強制）..."
      - rm -f ios/Uchikomi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - echo ""
      - echo "完全クリーンアップ完了"
      - echo "次のステップ:"
      - echo "  1. open ios/Uchikomi.xcodeproj"
      - echo "  2. File > Packages > Resolve Package Versions"
      - echo "  3. Product > Clean Build Folder (Shift+Cmd+K)"

  ios:reset-packages:
    desc: Package.resolvedを削除してSPM依存関係を再解決
    cmds:
      - echo "=== Package.resolved削除 ==="
      - rm -f ios/Uchikomi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - echo "Package.resolved削除完了"
      - echo "Xcodeで File > Packages > Resolve Package Versions を実行してください"
