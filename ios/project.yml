name: Uchikomi
options:
  bundleIdPrefix: dev.exe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  Uchikomi:
    type: application
    platform: iOS
    sources:
      - path: Uchikomi
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Uchikomi/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.exe.uchikomi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: Uchikomi/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "食事の写真を撮影するためにカメラを使用します"
        NSPhotoLibraryUsageDescription: "食事の画像を選択するためにフォトライブラリにアクセスします"

  UchikomiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: UchikomiWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.exe.uchikomi.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: UchikomiWidget/Info.plist
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - target: Uchikomi

  UchikomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UchikomiTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.exe.uchikomi.tests
    dependencies:
      - target: Uchikomi

schemes:
  Uchikomi:
    build:
      targets:
        Uchikomi: all
        UchikomiWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UchikomiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
