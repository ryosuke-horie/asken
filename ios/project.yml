name: Uchikomi
options:
  bundleIdPrefix: dev.exe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "11.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  UchikomiCore:
    type: framework
    platform: iOS
    sources:
      - path: UchikomiCore
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.exe.uchikomi.core
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"

  Uchikomi:
    type: application
    platform: iOS
    sources:
      - path: Uchikomi
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Uchikomi/Resources
        includes:
          - "GoogleService-Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Uchikomi/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.exe.uchikomi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: Uchikomi/Uchikomi.entitlements
    entitlements:
      path: Uchikomi/Uchikomi.entitlements
      properties: {}
    dependencies:
      - target: UchikomiCore
        embed: true
        link: true
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    # Info.plist is managed directly at Uchikomi/Resources/Info.plist
    # URL Schemes and GIDClientID are configured there for Google Sign-In

  UchikomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UchikomiTests
        excludes:
          - "**/.DS_Store"
          - "**/Snapshots/__Snapshots__/**"
          - "**/Disabled/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.exe.uchikomi.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Uchikomi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Uchikomi"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Uchikomi
        embed: false
        link: false
      - target: UchikomiCore
        embed: false
        link: true
      - package: SnapshotTesting
        product: SnapshotTesting

schemes:
  Uchikomi:
    build:
      targets:
        Uchikomi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UchikomiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
