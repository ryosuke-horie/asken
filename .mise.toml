[tools]
go = "1.25.6"
terraform = "1.10"

[env]
# GCP設定
GCP_PROJECT_ID = "utikomi-dev"
GCP_REGION = "asia-northeast1"
GCP_ZONE = "asia-northeast1-a"

# gcloud構成の自動切り替え（このディレクトリに入ると自動的にこの構成が使われる）
CLOUDSDK_ACTIVE_CONFIG_NAME = "utikomi-dev"

# Terraform用のサービスアカウント認証
GOOGLE_APPLICATION_CREDENTIALS = "{{config_root}}/sa-key.json"

# Terraform変数（TF_VAR_プレフィックス）
TF_VAR_gcp_project_id = "utikomi-dev"
TF_VAR_gcp_region = "asia-northeast1"

# tfstateバケット
TFSTATE_BUCKET = "utikomi-dev-tfstate"

# GitHub設定
TF_VAR_github_repository = "ryosuke-horie/utikomi"
# 1Password から GitHub Token を取得（アイテムID使用）
TF_VAR_github_token = "{{ exec(command='op read op://Personal/hq5okatv6au3etd7f7zc2nhqcq/token') }}"
# 1Password から GCP サービスアカウントキーを取得
TF_VAR_gcp_sa_key = "{{ exec(command='op read op://Personal/hktuxvsk6lsnfsntjvqnwbr7u4/credential') }}"
# 1Password から Gemini API Key を取得
TF_VAR_gemini_api_key = "{{ exec(command='op read op://Personal/obor4lhoi4tuuffbs67prldqli/password') }}"
# バックエンド用 Gemini API Key
GEMINI_API_KEY = "{{ exec(command='op read op://Personal/obor4lhoi4tuuffbs67prldqli/password') }}"
# 1Password から Firebase Web API Key を取得（E2Eテスト用）
TF_VAR_e2e_firebase_api_key = "{{ exec(command='op read op://Personal/rv57ami32mfypnskdwd4gpvlvm/credential') }}"
